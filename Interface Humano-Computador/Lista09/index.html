<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Obras</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/scripts.js" defer></script>
</head>
<body>
    <main>
        <h1>Consulta de Obras do IFTM</h1>
        <p>
            Informe um ou mais critérios para pesquisar livros
            e outras publicações.
        </p>
        <form id="formConsulta">
            <div class="campo">
                <label for="autor">Autor</label>
                <input type="text" id="autor" name="autor" placeholder="Digite o nome do autor">
            </div>

            <div class="campo">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" placeholder="Digite o título da obra">
            </div>

            <div class="campo">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="Ex: 9788532508126">
            </div>

            <p id="mensagemErro" class="msg erro"
               role="alert" hidden></p>

            <div class="acoes">
                <button type="submit">Buscar</button>
                <button type="reset">Limpar</button>
            </div>
        </form>

        <section aria-labelledby="tituloResultados">
            <h2 id="tituloResultados">Resultados da consulta</h2>
            <p id="status" role="status" aria-live="polite">
                Preencha pelo menos um campo para começar.
            </p>
            <ul id="resultados"></ul>
        </section>

    </main>
</body>
</html>
